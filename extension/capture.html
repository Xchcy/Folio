<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收集到 Folio</title><link rel="stylesheet" href="capture.css"></head><body><header><span class="mark"><img src="folio-logo.png" alt="Folio"></span><div><h1>Folio · 随手记</h1><p>先收下，再安排。</p></div><button id="cancel" aria-label="关闭">×</button></header><main><form id="form"><label>选中的内容<textarea id="text" maxlength="30000" placeholder="输入或粘贴文字，也可以粘贴图片"></textarea></label><div id="image-wrap" hidden><img id="image" alt="待保存图片"><button type="button" id="remove-image">移除图片</button></div><label class="upload">添加图片<input type="file" id="file" accept="image/png,image/jpeg,image/webp"></label><label>补充一句（可选）<textarea id="note" maxlength="4000" placeholder="例如：周五联系对方，确认报价"></textarea></label><details><summary>来源与时间</summary><label>来源标题<input id="source-title" maxlength="500"></label><label>网页链接<input id="source-url" type="url"></label><label>原始内容时间<input id="original" type="datetime-local"></label><p>收集时间自动记录；旧内容的“明天”按原始时间理解。</p></details><p id="status" role="status"></p><div id="duplicate" hidden><button type="button" id="append">追加说明</button><button type="button" id="copy">再次保存</button></div><button id="save" type="submit">保存到Folio</button><p class="privacy">内容保存在这台电脑。AI 整理随后进行。</p></form><a id="inbox" href="http://127.0.0.1:8771/#inbox" target="_blank" rel="noopener">打开Folio收集箱</a><section id="draft-list" hidden><h2>未保存的草稿</h2><div id="draft-items"></div></section></main><script src="capture.js"></script></body></html>
